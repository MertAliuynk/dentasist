services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bdh
      POSTGRES_PASSWORD: bdh_dev_password
      POSTGRES_DB: bdh
    ports:
      - "5432:5432"
    volumes:
      - bdh_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdh"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dentasist
      MINIO_ROOT_PASSWORD: bdh_dev_password
    ports:
      - "9000:9000" # S3 API — matches S3_ENDPOINT=http://localhost:9000 in .env
      - "9001:9001" # Web console: http://localhost:9001 (dentasist / bdh_dev_password)
    volumes:
      - bdh_s3data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 dentasist bdh_dev_password &&
      mc mb --ignore-existing local/dentasist-xrays
      "

volumes:
  bdh_pgdata_dev:
  bdh_s3data_dev:
