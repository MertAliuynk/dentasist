services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Platform (internal team) admin panel — separate secret from
      # AUTH_SECRET on purpose (see .env.example). Owner bootstrap
      # email/password are only needed the first time `pnpm db:seed` runs;
      # safe to leave set, but rotate the password from inside the panel
      # and you can blank these two after the first deploy.
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-DişPanel}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
      # Object storage (RustFS, S3-compatible) over the internal network.
      S3_ENDPOINT: http://storage:9000
      # Browser-reachable address of the same storage (e.g. https://s3.example.com).
      # Upload/view links are signed for this host; without it images won't load.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT gerekli}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-dentasist-xrays}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dentasist}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      # Encrypts stored SMS provider passwords (falls back to AUTH_SECRET).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SMS_REMINDER_WORKER: ${SMS_REMINDER_WORKER:-on}
      # Server's public outbound IP, shown to clinics for NetGSM IP whitelisting.
      SMS_OUTBOUND_IP: ${SMS_OUTBOUND_IP:-}
      # Prisma connection pool per app instance (see src/server/db.ts).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      # Technical action log (ActivityLog) older than this is pruned. Clinic data is never touched.
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-90}
      # Keep the JS heap below the container limit so Node GCs instead of being OOM-killed.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
    # No `ports:` on purpose — Coolify's proxy (Traefik) reaches the app over
    # the internal network. Publishing 3000 on the host would let anyone
    # bypass the proxy (and its TLS / real-IP headers) entirely.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Modest tuning for a small VPS; raise shared_buffers (~25% of RAM) on bigger servers.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=100
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=2000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-bdh}
    volumes:
      - bdh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdh}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2g}

  # Daily pg_dump (custom format, compressed; restore with pg_restore), kept for BACKUP_KEEP_DAYS on the bdh_backups
  # volume. Set BACKUP_S3_BUCKET (+ BACKUP_S3_ENDPOINT / keys) to also copy
  # each dump off the server — a backup on the same disk doesn't survive
  # losing that disk.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bdh}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      PGDATABASE: ${POSTGRES_DB:-bdh}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - bdh_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        if [ -n "$$BACKUP_S3_BUCKET" ]; then apk add --no-cache aws-cli >/dev/null || echo "[backup] aws-cli kurulamadı, sadece yerel yedek alınacak"; fi
        while true; do
          f="/backups/bdh-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump --format=custom --no-owner --no-privileges --file="$$f.tmp" && [ -s "$$f.tmp" ]; then
            mv "$$f.tmp" "$$f"
            echo "[backup] alındı: $$f ($$(du -h "$$f" | cut -f1))"
            if [ -n "$$BACKUP_S3_BUCKET" ] && command -v aws >/dev/null; then
              if [ -n "$$BACKUP_S3_ENDPOINT" ]; then EP="--endpoint-url $$BACKUP_S3_ENDPOINT"; else EP=""; fi
              aws s3 cp "$$f" "s3://$$BACKUP_S3_BUCKET/$$(basename "$$f")" $$EP && echo "[backup] sunucu dışına kopyalandı" || echo "[backup] UYARI: sunucu dışına kopyalanamadı"
            fi
          else
            rm -f "$$f.tmp"
            echo "[backup] HATA: pg_dump başarısız"
          fi
          find /backups -name 'bdh-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  # S3-compatible object storage for X-rays / support images. RustFS is a
  # drop-in MinIO replacement (MinIO stopped publishing its images). Pinned
  # to a release so a new "latest" can't change behaviour on redeploy.
  # No host ports: it's reached through Coolify's domain (S3_PUBLIC_ENDPOINT)
  # and by the app over the internal network (http://storage:9000).
  # The bucket is created by the app itself on first upload.
  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-dentasist}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
    volumes:
      - bdh_s3data:/data

  # One-shot: RustFS runs as UID 10001, a fresh named volume is root-owned.
  storage-perms:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - bdh_s3data:/data
    restart: "no"
volumes:
  bdh_pgdata:
  bdh_s3data:
  bdh_backups:
