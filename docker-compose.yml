services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Platform (internal team) admin panel — separate secret from
      # AUTH_SECRET on purpose (see .env.example). Owner bootstrap
      # email/password are only needed the first time `pnpm db:seed` runs;
      # safe to leave set, but rotate the password from inside the panel
      # and you can blank these two after the first deploy.
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dentasist}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
      # MinIO (S3-compatible) — patient X-ray/image storage. Talks to the
      # bundled `storage` service over the internal docker network, not the
      # host-mapped port below (that one's just for local debugging/console
      # access via mc/browser).
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-dentasist-xrays}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dentasist}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      # Encrypts stored SMS provider passwords (falls back to AUTH_SECRET).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SMS_REMINDER_WORKER: ${SMS_REMINDER_WORKER:-on}
      # Server's public outbound IP, shown to clinics for NetGSM IP whitelisting.
      SMS_OUTBOUND_IP: ${SMS_OUTBOUND_IP:-}
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-bdh}
    volumes:
      - bdh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dentasist}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
    volumes:
      - bdh_s3data:/data
    ports:
      - "9000:9000" # S3 API (only needed exposed if debugging from the host)
      - "9001:9001" # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container: creates the X-ray bucket if it doesn't exist
  # yet, then exits. `storage` staying healthy doesn't imply the bucket
  # exists — this runs once per `docker compose up`, which is idempotent
  # (mc mb --ignore-existing).
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dentasist}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      S3_BUCKET: ${S3_BUCKET:-dentasist-xrays}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET
      "

volumes:
  bdh_pgdata:
  bdh_s3data:
