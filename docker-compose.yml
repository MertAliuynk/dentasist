services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Platform (internal team) admin panel — separate secret from
      # AUTH_SECRET on purpose (see .env.example). Owner bootstrap
      # email/password are only needed the first time `pnpm db:seed` runs;
      # safe to leave set, but rotate the password from inside the panel
      # and you can blank these two after the first deploy.
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dentasist}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
      # Object storage (RustFS, S3-compatible) over the internal network.
      S3_ENDPOINT: http://storage:9000
      # Browser-reachable address of the same storage (e.g. https://s3.example.com).
      # Upload/view links are signed for this host; without it images won't load.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT gerekli}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-dentasist-xrays}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dentasist}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      # Encrypts stored SMS provider passwords (falls back to AUTH_SECRET).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SMS_REMINDER_WORKER: ${SMS_REMINDER_WORKER:-on}
      # Server's public outbound IP, shown to clinics for NetGSM IP whitelisting.
      SMS_OUTBOUND_IP: ${SMS_OUTBOUND_IP:-}
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-bdh}
    volumes:
      - bdh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for X-rays / support images. RustFS is a
  # drop-in MinIO replacement (MinIO stopped publishing its images). Pinned
  # to a release so a new "latest" can't change behaviour on redeploy.
  # No host ports: it's reached through Coolify's domain (S3_PUBLIC_ENDPOINT)
  # and by the app over the internal network (http://storage:9000).
  # The bucket is created by the app itself on first upload.
  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      storage-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-dentasist}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
    volumes:
      - bdh_s3data:/data

  # One-shot: RustFS runs as UID 10001, a fresh named volume is root-owned.
  storage-perms:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - bdh_s3data:/data
    restart: "no"
volumes:
  bdh_pgdata:
  bdh_s3data:
